services:
  postgres:
    image: postgres:16-alpine
    container_name: egs-postgres
    environment:
      POSTGRES_DB: egs_local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d egs_local"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: egs-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: egs-backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      LOCAL_AUTH_SECRET: ${LOCAL_AUTH_SECRET:?LOCAL_AUTH_SECRET is required}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      AUTO_RESET_DEFAULT_ADMIN_PASSWORD: "false"
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_REQUIRE_HTTPS: ${AUTH_REQUIRE_HTTPS:-true}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://gnambaservices.ci}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  postgres_data:
