services:
  postgres:
    image: postgres:16-alpine
    container_name: egs-postgres
    environment:
      POSTGRES_DB: egs_local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d egs_local"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: egs-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: egs-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/egs_local
      LOCAL_AUTH_SECRET: egs-local-dev-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

volumes:
  postgres_data:
