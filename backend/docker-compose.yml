# ⚠️  COMPOSE DE DEVELOPPEMENT LOCAL
# ⚠️  Lancé UNIQUEMENT avec --profile dev
# ⚠️  Pour la prod, utiliser /home/soma/gnamba-project/docker-compose.yml

name: egs-dev

services:
  postgres:
    profiles: ["dev"]
    image: postgres:16-alpine
    container_name: egs-postgres-dev
    environment:
      POSTGRES_DB: egs_local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d egs_local"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    profiles: ["dev"]
    image: redis:7-alpine
    container_name: egs-redis-dev
    ports:
      - "127.0.0.1:6380:6379"

  backend:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: egs-backend-dev
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      LOCAL_AUTH_SECRET: ${LOCAL_AUTH_SECRET:?LOCAL_AUTH_SECRET is required}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      AUTO_RESET_DEFAULT_ADMIN_PASSWORD: "false"
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_REQUIRE_HTTPS: ${AUTH_REQUIRE_HTTPS:-false}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8001}
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:8001:8000"

volumes:
  postgres_data:
    name: egs-dev-postgres-data
