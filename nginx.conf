server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers - OWASP recommended
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    set $egs_csp "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://static.cloudflareinsights.com https://cloudflareinsights.com https://cdn.onesignal.com https://challenges.cloudflare.com https://www.youtube.com https://www.youtube-nocookie.com https://s.ytimg.com; script-src-elem 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://cloudflareinsights.com https://cdn.onesignal.com https://challenges.cloudflare.com https://www.youtube.com https://www.youtube-nocookie.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com https://r2cdn.perplexity.ai; img-src 'self' data: blob: https://*.supabase.co https://*.supabase.in https://gnambaservices.ci https://i.ytimg.com https://yt3.ggpht.com https://*.googleusercontent.com; connect-src 'self' https://thykrnoqgylrbfupophs.supabase.co wss://thykrnoqgylrbfupophs.supabase.co https://cloudflareinsights.com https://static.cloudflareinsights.com https://www.youtube.com https://www.youtube-nocookie.com https://o0.ingest.sentry.io https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://onesignal.com https://api.onesignal.com https://challenges.cloudflare.com http://localhost:11434; worker-src 'self' blob:; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com https://challenges.cloudflare.com; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests;";
    add_header Content-Security-Policy $egs_csp always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Global wildcard CORS removed for security. Specific endpoints manage CORS explicitly where required.
    # add_header Cross-Origin-Embedder-Policy "unsafe-none" always;
    # add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Health check endpoint
    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location = /favicon.ico {
        rewrite ^ /default-logo.svg last;
    }

    location @asset_404 {
        internal;
        default_type text/plain;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        return 404 "Asset not found\n";
    }

    # Entry bundle: dynamic Vite chunks import this path without the ?v= cache buster.
    # It must never be cached immutably, otherwise browsers can mix old/new React chunks.
    location = /assets/index.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        error_page 404 = @asset_404;
        try_files $uri =404;
    }

    location = /assets/index.css {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        error_page 404 = @asset_404;
        try_files $uri =404;
    }

    # Handle Vite hashed chunks/assets (content-hashed filenames -> cache immutable 1 an)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        error_page 404 = @asset_404;
        try_files $uri =404;
    }

    # Autres fichiers statiques racine (icons, manifest, robots…)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # Handle API routes (if any)
    location /api/ {
        try_files $uri =404;
    }

    # Filebrowser reverse proxy. The trailing slash strips /filebrowser/
    # before forwarding, so /filebrowser/api/login reaches /api/login.
    location /filebrowser/ {
        proxy_pass http://egs-filebrowser:80/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 86400;
    }

    # SPA fallback - always serve index.html for non-static routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $egs_csp always;
    }

    # Security headers for specific routes
    location ~ ^/(login|register|auth) {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy $egs_csp always;
        try_files $uri /index.html;
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
