version: "3.8"

services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    ports:
      - "${FILEBROWSER_PORT:-8081}:80"
    command:
      [
        "--address",
        "0.0.0.0",
        "--port",
        "80",
        "--database",
        "/database/filebrowser.db",
      ]
    volumes:
      # Répertoire de fichiers partagés (EGS Documents)
      - /home/soma/partage:/srv

      # Base de données utilisateur
      - /home/soma/filebrowser/database:/database
      # Configuration
      - /home/soma/filebrowser/config:/config
    environment:
      - FB_BASE_URL=/
      - FB_ADDRESS=0.0.0.0
      - FB_PORT=80
    # Run as root to avoid permission issues
    user: "0:0"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:80",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
