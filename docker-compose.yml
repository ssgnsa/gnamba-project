# EGS - Docker Compose officiel
#
# Production:
#   docker compose up -d --build
#
# Le frontend publié est l'artefact unique `dist/`, servi par Nginx depuis
# `/var/www/egs/current`. Le backend officiel est l'API FastAPI locale.

services:
  egs-api:
    image: egs-api:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: egs-api
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-EGS Local API}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      LOCAL_AUTH_SECRET: ${LOCAL_AUTH_SECRET:?LOCAL_AUTH_SECRET is required}
      LOCAL_AUTH_ACCESS_TOKEN_TTL_SECONDS: ${LOCAL_AUTH_ACCESS_TOKEN_TTL_SECONDS:-3600}
      LOCAL_AUTH_REFRESH_TOKEN_TTL_SECONDS: ${LOCAL_AUTH_REFRESH_TOKEN_TTL_SECONDS:-2592000}
      SQL_ECHO: ${SQL_ECHO:-false}
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - egs-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('https://api.gnambaservices.ci/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  egs-web:
    image: egs-web:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_MODE: ${VITE_API_MODE:-local}
        VITE_API_URL: ${VITE_API_URL:-https://api.gnambaservices.ci}
        VITE_LOCAL_API_URL: ${VITE_LOCAL_API_URL:-https://api.gnambaservices.ci}
    container_name: egs-web
    restart: unless-stopped
    depends_on:
      egs-api:
        condition: service_healthy
    environment:
      VITE_API_MODE: ${VITE_API_MODE:-local}
      VITE_API_URL: ${VITE_API_URL:-https://api.gnambaservices.ci}
      VITE_LOCAL_API_URL: ${VITE_LOCAL_API_URL:-https://api.gnambaservices.ci}
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - egs-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "https://api.gnambaservices.ci/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  egs-network:
    name: egs-network
