services:
  egs-postgres:
    image: postgres:16-alpine
    container_name: egs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: egs_local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - egs-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d egs_local"]
      interval: 10s
      timeout: 5s
      retries: 5

  egs-redis:
    image: redis:7-alpine
    container_name: egs-redis
    restart: unless-stopped
    networks:
      - egs-network

  egs-api:
    image: egs-api:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: egs-api
    restart: unless-stopped
    depends_on:
      egs-postgres:
        condition: service_healthy
      egs-redis:
        condition: service_started
    environment:
      APP_NAME: ${APP_NAME:-EGS Local API}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      LOCAL_AUTH_SECRET: ${LOCAL_AUTH_SECRET:?LOCAL_AUTH_SECRET is required}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?INITIAL_ADMIN_PASSWORD is required}
      AUTO_RESET_DEFAULT_ADMIN_PASSWORD: ${AUTO_RESET_DEFAULT_ADMIN_PASSWORD:-true}
      LOCAL_AUTH_ACCESS_TOKEN_TTL_SECONDS: ${LOCAL_AUTH_ACCESS_TOKEN_TTL_SECONDS:-3600}
      LOCAL_AUTH_REFRESH_TOKEN_TTL_SECONDS: ${LOCAL_AUTH_REFRESH_TOKEN_TTL_SECONDS:-2592000}
      SQL_ECHO: ${SQL_ECHO:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://gnambaservices.ci,https://www.gnambaservices.ci,https://api.gnambaservices.ci,http://localhost:8080}
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - egs-network
    volumes:
      - ./backend/storage:/app/backend/storage
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://egs-api:8000/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  egs-web:
    image: egs-web:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_MODE: ${VITE_API_MODE:-local}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_LOCAL_API_URL: ${VITE_LOCAL_API_URL:-https://api.gnambaservices.ci}
    container_name: egs-web
    restart: unless-stopped
    depends_on:
      egs-api:
        condition: service_healthy
    environment:
      VITE_API_MODE: ${VITE_API_MODE:-local}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_LOCAL_API_URL: ${VITE_LOCAL_API_URL:-https://api.gnambaservices.ci}
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - egs-network
      - filebrowser
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    networks:
      - egs-network
      - filebrowser
    ports:
      - 8081:80
    volumes:
      - filebrowser_db:/database
      - /home/soma/partage:/srv
    environment:
      - FB_DATABASE=/database/filebrowser.db
      - FB_ADMIN_PASSWORD=gnambaAdmin2025!
volumes:
  postgres_data:
  filebrowser_db:

networks:
  egs-network:
    name: egs-network
  filebrowser:
    name: filebrowser
