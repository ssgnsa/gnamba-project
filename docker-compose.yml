services:
  egs-postgres:
    image: postgres:16-alpine
    container_name: egs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: egs_local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      EGS_DB_APP_PASSWORD: ${EGS_DB_APP_PASSWORD:?EGS_DB_APP_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init/10-create-application-role.sh:/docker-entrypoint-initdb.d/10-create-application-role.sh:ro
    networks:
      - egs-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d egs_local"]
      interval: 10s
      timeout: 5s
      retries: 5

  egs-redis:
    image: redis:7-alpine
    container_name: egs-redis
    restart: unless-stopped
    networks:
      - egs-network

  egs-api:
    image: egs-api:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: egs-api
    restart: unless-stopped
    depends_on:
      egs-postgres:
        condition: service_healthy
      egs-redis:
        condition: service_started
    env_file:
      - .env.server
    environment:
      APP_NAME: ${APP_NAME:-EGS Local API}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      LOCAL_AUTH_SECRET: ${LOCAL_AUTH_SECRET:?LOCAL_AUTH_SECRET is required}
      LOCAL_STORAGE_ROOT: /app/backend/storage/uploads
      ALLOW_RUNTIME_SCHEMA_DDL: "false"
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      AUTO_RESET_DEFAULT_ADMIN_PASSWORD: "false"
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      AUTH_REQUIRE_HTTPS: ${AUTH_REQUIRE_HTTPS:-true}
      AUTH_ALLOW_PRIVATE_NETWORK_HTTP: ${AUTH_ALLOW_PRIVATE_NETWORK_HTTP:-true}
      AUTH_LOGIN_RATE_LIMIT: ${AUTH_LOGIN_RATE_LIMIT:-10}
      AUTH_RESET_RATE_LIMIT: ${AUTH_RESET_RATE_LIMIT:-5}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-900}
      PASSWORD_RESET_TTL_SECONDS: ${PASSWORD_RESET_TTL_SECONDS:-1800}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://gnambaservices.ci}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      LOCAL_AUTH_ACCESS_TOKEN_TTL_SECONDS: ${LOCAL_AUTH_ACCESS_TOKEN_TTL_SECONDS:-600}
      LOCAL_AUTH_REFRESH_TOKEN_TTL_SECONDS: ${LOCAL_AUTH_REFRESH_TOKEN_TTL_SECONDS:-604800}
      SQL_ECHO: ${SQL_ECHO:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
    ports:
      - "0.0.0.0:${API_PORT:-8000}:8000"
    networks:
      - egs-network
    volumes:
      - ./backend/storage:/app/backend/storage
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://egs-api:8000/ready')"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  egs-web:
    image: egs-web:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_MODE: ${VITE_API_MODE:-local}
        VITE_API_URL: ${VITE_API_URL:-https://api.gnambaservices.ci/api/v1}
        VITE_LOCAL_API_URL: ${VITE_LOCAL_API_URL:-https://api.gnambaservices.ci}
    container_name: egs-web
    restart: unless-stopped
    depends_on:
      egs-api:
        condition: service_healthy
    environment:
      VITE_API_MODE: ${VITE_API_MODE:-local}
      VITE_API_URL: ${VITE_API_URL:-https://api.gnambaservices.ci/api/v1}
      VITE_LOCAL_API_URL: ${VITE_LOCAL_API_URL:-https://api.gnambaservices.ci}
    tmpfs:
      - /run/egs-runtime:rw,noexec,nosuid,size=16m
    ports:
      - "0.0.0.0:${WEB_PORT:-8080}:80"
    networks:
      - egs-network
      - filebrowser
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  filebrowser:
    image: filebrowser/filebrowser:v2.32.0
    container_name: filebrowser
    restart: unless-stopped
    ports:
      - "0.0.0.0:8081:80"
    networks:
      - egs-network
      - filebrowser
    volumes:
      - filebrowser_db:/database
      - /home/soma/partage:/srv
    environment:
      - FB_DATABASE=/database/filebrowser.db
      - FB_ADMIN_PASSWORD=${FB_ADMIN_PASSWORD:?FB_ADMIN_PASSWORD is required}
volumes:
  postgres_data:
  filebrowser_db:

networks:
  egs-network:
    name: egs-network
  filebrowser:
    name: filebrowser
