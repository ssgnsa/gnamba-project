[global]
   server string = EGS Samba Server
   workgroup = WORKGROUP
   netbios name = EGS-SAMBA
   security = user
   map to guest = Bad User
   log file = /var/log/samba/log.%m
   max log size = 50
   client min protocol = SMB2
   server min protocol = SMB2
   server max protocol = SMB3
   smb encrypt = desired
   dns proxy = no
   load printers = no
   printing = bsd
   disable spoolss = yes

[egs-docs]
   comment = EGS Documents Share
   path = /srv/egs-docs
   browseable = yes
   read only = no
   guest ok = no
   create mask = 0664
   directory mask = 2775
   force user = root
   force group = root
   veto files = /.wopi-locks/
   hide dot files = no
