version: '3.8'

services:
  egs-frontend-standalone:
    profiles: ["standalone"]
    image: egs-frontend:standalone
    build:
      context: .
      dockerfile: Dockerfile.standalone
      args:
        VITE_SUPABASE_MODE: ${VITE_SUPABASE_MODE:-cloud}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    container_name: egs-frontend-standalone
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - gnamba-net

networks:
  gnamba-net:
    driver: bridge
