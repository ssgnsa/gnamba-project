# ============================================
# EGS - Production avec HTTPS (Let's Encrypt)
# ============================================
# Usage:
#   docker-compose -f docker-compose.https.yml up -d
#
# Prérequis:
#   - Domaine gnambaservices.ci pointant vers ce serveur
#   - Ports 80 et 443 ouverts
# ============================================

services:
  # ============================================
  # Traefik - Reverse Proxy + Let's Encrypt
  # ============================================
  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--api.dashboard.rule=Host(`traefik.gnambaservices.ci`)"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@gnambaservices.ci"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      # Redirection HTTP -> HTTPS
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    networks:
      - gnamba-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.gnambaservices.ci`)"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=admin:$$apr1$$H6uskkkW$$IgXLP6ewTrSuBkTrqE8wj/"

  # ============================================
  # EGS Web - Runtime Environment Variables
  # Pas de secrets dans le build !
  # ============================================
  egs-web:
    image: egs-web:runtime
    build:
      context: .
      dockerfile: Dockerfile.runtime
    container_name: egs-web
    restart: unless-stopped
    environment:
      # Variables passées au runtime (pas dans le build)
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-https://thykrnoqgylrbfupophs.supabase.co}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
      - VITE_SUPABASE_MODE=${VITE_SUPABASE_MODE:-cloud}
    networks:
      - gnamba-network
    labels:
      # Traefik routing
      - "traefik.enable=true"
      - "traefik.http.routers.egs.rule=Host(`gnambaservices.ci`) || Host(`www.gnambaservices.ci`)"
      - "traefik.http.routers.egs.tls.certresolver=letsencrypt"
      - "traefik.http.routers.egs.entrypoints=websecure"
      - "traefik.http.services.egs.loadbalancer.server.port=80"
      # Security headers
      - "traefik.http.middlewares.egs-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.egs-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.egs-headers.headers.stsPreload=true"
      - "traefik.http.routers.egs.middlewares=egs-headers"
    depends_on:
      - traefik

  # ============================================
  # Filebrowser - Gestionnaire de fichiers
  # ============================================
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    environment:
      - FB_BASE_URL=/
      - FB_ADDRESS=0.0.0.0
      - FB_PORT=80
      - FB_DATABASE=/database/filebrowser.db
    volumes:
      - /home/soma/partage:/srv
      - /home/soma/filebrowser/database:/database
    networks:
      - gnamba-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.filebrowser.rule=Host(`files.gnambaservices.ci`)"
      - "traefik.http.routers.filebrowser.tls.certresolver=letsencrypt"
      - "traefik.http.routers.filebrowser.entrypoints=websecure"
      - "traefik.http.services.filebrowser.loadbalancer.server.port=80"
      # Basic auth pour Filebrowser
      - "traefik.http.middlewares.filebrowser-auth.basicauth.users=admin:$$apr1$$H6uskkkW$$IgXLP6ewTrSuBkTrqE8wj/"
      - "traefik.http.routers.filebrowser.middlewares=filebrowser-auth"
    depends_on:
      - traefik

networks:
  gnamba-network:
    name: gnamba-network
    driver: bridge

volumes:
  letsencrypt:
    driver: local
