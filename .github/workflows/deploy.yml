# ============================================
# EGS - GitHub Actions CI/CD Pipeline
# ============================================
# Build, test, and deploy EGS application
# ============================================

name: Build and Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  NODE_VERSION: "22"
  SUPABASE_VERSION: "2.78.1"

jobs:
  # ============================================
  # Build Job
  # ============================================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure @supabase/supabase-js is not a runtime dependency
        run: |
          node -e "const p=require('./package.json'); if(p.dependencies && p.dependencies['@supabase/supabase-js']){console.error('Error: @supabase/supabase-js must not be in dependencies for production'); process.exit(1);} console.log('OK: @supabase/supabase-js not present in dependencies');"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Verify canonical API build configuration
        run: |
          if [[ -z "${VITE_LOCAL_API_URL}" ]]; then
            echo "VITE_LOCAL_API_URL is missing"
            exit 1
          fi
        env:
          VITE_LOCAL_API_URL: https://api.gnambaservices.ci

      - name: Build application
        run: npm run build
        env:
          VITE_API_MODE: local
          VITE_LOCAL_API_URL: https://api.gnambaservices.ci
          # Do not expose Supabase publishable keys in production builds.

      - name: Validate frontend release artifacts
        run: npm run validate:frontend

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Manual signature validation only. The Docker build and deploy jobs below
  # are restricted to push events on main, so this path cannot publish.
  sign-frontend:
    name: Sign Frontend Artifact (Manual Validation)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Package, sign, and verify frontend artifact
        env:
          EGS_RELEASE_SIGNING_KEY: ${{ secrets.EGS_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          set +x
          if [[ -z "${EGS_RELEASE_SIGNING_KEY:-}" ]]; then
            echo "::error::Required secret EGS_RELEASE_SIGNING_KEY is not configured"
            exit 1
          fi

          key_file="$RUNNER_TEMP/egs-release-signing-key.pem"
          release_dir="$RUNNER_TEMP/egs-frontend-release"
          cleanup() { rm -f -- "$key_file"; }
          trap cleanup EXIT
          (umask 077; printf '%s' "$EGS_RELEASE_SIGNING_KEY" > "$key_file")
          chmod 0600 "$key_file"
          export EGS_RELEASE_SIGNING_KEY_FILE="$key_file"
          export EGS_RELEASE_OUTPUT="$release_dir"

          python scripts/package-frontend-release.py

          test -s ops/egs-publisher/ci-ed25519.pub
          openssl pkey -pubin -in ops/egs-publisher/ci-ed25519.pub -noout
          mapfile -t manifests < <(find "$release_dir" -maxdepth 1 -type f -name '*.json' -print)
          if [[ "${#manifests[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one signed attestation"
            exit 1
          fi
          manifest="${manifests[0]}"
          request_id="$(basename "$manifest" .json)"
          if [[ ! "$request_id" =~ ^[a-f0-9]{32}$ ]]; then
            echo "::error::Invalid release request identifier"
            exit 1
          fi
          archive="$release_dir/$request_id.tar"
          signature="$release_dir/$request_id.sig"
          test -s "$archive"
          test -s "$signature"
          openssl pkeyutl -verify -pubin \
            -inkey ops/egs-publisher/ci-ed25519.pub \
            -rawin -in "$manifest" -sigfile "$signature" >/dev/null
          python - "$archive" "$manifest" dist/VERSION.json <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          archive, manifest, version_file = map(pathlib.Path, sys.argv[1:])
          attestation = json.loads(manifest.read_bytes())
          archive_hash = hashlib.sha256(archive.read_bytes()).hexdigest()
          version_hash = hashlib.sha256(version_file.read_bytes()).hexdigest()
          if attestation.get("archive_sha256") != archive_hash:
              raise SystemExit("attested archive hash does not match the artifact")
          if attestation.get("version_json_sha256") != version_hash:
              raise SystemExit("attested VERSION.json hash does not match the build")
          if attestation.get("release_check") is not True or attestation.get("frontend_validation") is not True:
              raise SystemExit("required frontend validation gates are not attested")
          if sorted(path.name for path in archive.parent.iterdir()) != sorted(
              [archive.name, manifest.name, manifest.with_suffix(".sig").name]
          ):
              raise SystemExit("unexpected file found in signed artifact staging")
          print("Signature and archive/version hashes verified")
          PY

      - name: Upload signed frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: egs-frontend-signed
          path: ${{ runner.temp }}/egs-frontend-release/*
          if-no-files-found: error
          retention-days: 7

  # ============================================
  # Docker Build Job (Production)
  # ============================================
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      DOCKER_LOGIN_CONFIGURED: ${{ secrets.DOCKER_USERNAME != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub (optional)
        uses: docker/login-action@v3
        if: ${{ env.DOCKER_LOGIN_CONFIGURED == 'true' }}
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: egs-frontend:latest,egs-frontend:${{ github.sha }}
          build-args: |
            VITE_API_MODE=local
            VITE_LOCAL_API_URL=https://api.gnambaservices.ci
          cache-from: type=registry,ref=egs-frontend:buildcache
          cache-to: type=inline

      - name: Save Docker image
        run: |
          docker save egs-frontend:latest > egs-frontend.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: egs-frontend.tar
          retention-days: 7

  # ============================================
  # Deploy Job (SSH/SCP)
  # ============================================
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [build, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    env:
      NPM_CONFIG_PRODUCTION: "true"
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: |
          docker load < egs-frontend.tar
          rm egs-frontend.tar

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /opt/egs

            # Stop old containers
            docker compose -f docker-compose.prod.yml down

            # Load new image
            docker load < egs-frontend.tar

            # Start new containers from the loaded image without rebuilding
            docker compose -f docker-compose.prod.yml up -d --no-build

            # Cleanup old images
            docker image prune -f

      - name: Health check
        uses: jtalk/url-health-check-action@v3
        with:
          url: ${{ secrets.HEALTH_CHECK_URL || 'https://gnambaservices.ci/health' }}
          max-attempts: 5
          retry-delay: 10s

  # ============================================
  # Notification Job (Optional)
  # ============================================
  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always() && github.event_name != 'workflow_dispatch'
    env:
      SMTP_SERVER_CONFIGURED: ${{ secrets.SMTP_SERVER != '' }}

    steps:
      - name: Send email notification (optional)
        uses: dawidd6/action-send-mail@v3
        if: ${{ env.SMTP_SERVER_CONFIGURED == 'true' }}
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT || 587 }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "EGS Deployment ${{ needs.deploy.result }}"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: "GitHub Actions <noreply@egs.ci>"
          body: |
            Deployment ${{ needs.deploy.result }}

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}

            View run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
