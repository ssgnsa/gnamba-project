# ============================================
# EGS - GitHub Actions CI/CD Pipeline
# ============================================
# Build, test, and deploy EGS application
# ============================================

name: Build and Deploy

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish_frontend:
        description: Publier l’artefact frontend signé sur gnambaservices.ci
        required: true
        type: boolean
        default: false

env:
  NODE_VERSION: "22"
  SUPABASE_VERSION: "2.78.1"

jobs:
  # ============================================
  # Build Job
  # ============================================
  build:
    name: Build Application
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Ensure @supabase/supabase-js is not a runtime dependency
        run: |
          node -e "const p=require('./package.json'); if(p.dependencies && p.dependencies['@supabase/supabase-js']){console.error('Error: @supabase/supabase-js must not be in dependencies for production'); process.exit(1);} console.log('OK: @supabase/supabase-js not present in dependencies');"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run frontend tests
        run: npm run test:run

      - name: Verify canonical API build configuration
        run: |
          for name in VITE_API_URL VITE_LOCAL_API_URL; do
            if [[ -z "${!name}" ]]; then
              echo "${name} is missing"
              exit 1
            fi
          done
          if [[ "${VITE_SELFHOSTED_MODE}" != "true" ]]; then
            echo "VITE_SELFHOSTED_MODE must be true for the production artifact"
            exit 1
          fi
        env:
          VITE_API_URL: https://api.gnambaservices.ci/api/v1
          VITE_LOCAL_API_URL: https://api.gnambaservices.ci
          VITE_SELFHOSTED_MODE: "true"

      - name: Build application
        run: npm run build
        env:
          VITE_API_MODE: local
          VITE_API_URL: https://api.gnambaservices.ci/api/v1
          VITE_LOCAL_API_URL: https://api.gnambaservices.ci
          VITE_SELFHOSTED_MODE: "true"
          EGS_RELEASE_REF: ${{ github.ref }}
          EGS_RELEASE_BRANCH: ${{ github.ref_name }}
          # Do not expose Supabase publishable keys in production builds.

      - name: Validate frontend release artifacts
        run: npm run validate:frontend

      - name: Test deployment controller fail-closed paths
        run: python3 ops/deploy/test_controller.py

      - name: Verify built artifact identity and expected files
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse --verify HEAD)"
          test "$EXPECTED_SHA" = "$actual_sha"
          test -s dist/index.html
          test -s dist/VERSION.json
          test -d dist/assets
          find dist/assets -type f -print -quit | grep -q .
          test "$(node -p "JSON.parse(require('fs').readFileSync('dist/VERSION.json')).git_commit")" = "$EXPECTED_SHA"
          test "$(node -p "JSON.parse(require('fs').readFileSync('dist/VERSION.json')).git_ref")" = "$GITHUB_REF"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  backend-validation:
    name: Validate FastAPI backend and Alembic
    runs-on: ubuntu-latest
    env:
      EGS_TEST_DATABASE_URL: postgresql://egs_ci:egs_ci_nonprod@localhost:5432/egs_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: egs_ci
          POSTGRES_PASSWORD: egs_ci_nonprod
          POSTGRES_DB: egs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U egs_ci -d egs_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt pytest httpx

      - name: Compile backend and migration sources
        run: python -m compileall -q backend/app backend/alembic backend/tests

      - name: Prepare isolated PostgreSQL test schema
        working-directory: backend
        run: |
          set -euo pipefail
          export DATABASE_URL="$EGS_TEST_DATABASE_URL"
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.begin() as connection:
              connection.execute(text('CREATE EXTENSION IF NOT EXISTS "uuid-ossp"'))
              connection.execute(text("CREATE ROLE postgres NOLOGIN"))
              connection.execute(text("CREATE ROLE egs_test_user NOLOGIN"))
          engine.dispose()
          PY
          python -m app.core.alembic_version_capacity --apply
          python -m alembic upgrade head

      - name: Run backend tests
        run: pytest -c backend/pytest.ini -q --tb=line backend/tests

      - name: Verify Alembic migration chain
        working-directory: backend
        run: |
          set -euo pipefail
          export DATABASE_URL="$EGS_TEST_DATABASE_URL"
          python -m alembic heads
          python -m alembic history -r=-8:head
          python -m alembic upgrade head
          # The ORM is a compatibility projection over a legacy schema. The
          # migration chain is authoritative and intentionally preserves
          # unmapped legacy tables/columns, so an exact `alembic check` would
          # report expected compatibility objects as destructive drift.
          python -m alembic current

  container-validation:
    name: Build container images and validate Compose
    runs-on: ubuntu-latest
    needs: [build, backend-validation]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: egs-web:ci

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: egs-api:ci

      - name: Validate canonical Compose configuration
        run: |
          set -euo pipefail
          trap 'rm -f .env.server' EXIT
          printf '%s\n' \
            'POSTGRES_PASSWORD=ci-compose-validation' \
            'DATABASE_URL=postgresql://postgres:ci-compose-validation@egs-postgres:5432/egs_local' \
            'LOCAL_AUTH_SECRET=ci-compose-validation-secret-012345678901234567890123456789' \
            'FB_ADMIN_PASSWORD=ci-compose-validation' > .env.server
          docker compose --env-file .env.server config --quiet
          docker compose --env-file .env.server config --format json |
            jq -e '.services["egs-postgres"].healthcheck.test and .services["egs-api"].healthcheck.test and .services["egs-web"].healthcheck.test' \
              >/dev/null

      - name: Validate isolated new-host deployment
        run: |
          set -euo pipefail
          env_file=.env.new-host-ci
          api_env_file=.env.new-host-api-ci
          trap 'rm -f "$env_file" "$api_env_file"' EXIT
          app_password=ci-new-host-app-password-0123456789abcdef012345
          : > "$api_env_file"
          chmod 0600 "$api_env_file"
          printf '%s\n' \
            'EGS_EXPECTED_HOSTNAME=egs-ci-new-host' \
            "EGS_API_ENV_FILE=$GITHUB_WORKSPACE/$api_env_file" \
            'POSTGRES_PASSWORD=ci-new-host-postgres-password-0123456789' \
            "EGS_DB_APP_PASSWORD=$app_password" \
            "DATABASE_URL=postgresql://egs_app:${app_password}@egs-postgres:5432/egs_local" \
            'LOCAL_AUTH_SECRET=ci-new-host-local-auth-secret-0123456789' \
            'INITIAL_ADMIN_PASSWORD=ci-new-host-admin-password' \
            'FB_ADMIN_PASSWORD=ci-new-host-filebrowser-password-0123456789' \
            'PUBLIC_APP_URL=https://egs.example.test' \
            'VITE_API_URL=https://api.egs.example.test/api/v1' \
            'VITE_LOCAL_API_URL=https://api.egs.example.test' \
            'CORS_ORIGINS=https://egs.example.test,https://api.egs.example.test' \
            > "$env_file"
          chmod 0600 "$env_file"
          python3 scripts/test_deploy_new_host.py
          python3 scripts/deploy_new_host.py validate --env-file "$env_file"
          EGS_ENV_FILE="$GITHUB_WORKSPACE/$env_file" \
            EGS_RELEASE_SHA="$GITHUB_SHA" \
            docker compose --project-directory "$GITHUB_WORKSPACE" \
              --project-name egs-ci-new-host --env-file "$env_file" \
              -f docker-compose.new-host.yml config --quiet
          EGS_ENV_FILE="$GITHUB_WORKSPACE/$env_file" \
            EGS_RELEASE_SHA="$GITHUB_SHA" \
            docker compose --project-directory "$GITHUB_WORKSPACE" \
              --project-name egs-ci-new-host --env-file "$env_file" \
              -f docker-compose.new-host.yml config --format json |
            jq -e '
              .services["egs-postgres"].ports == null and
                .services["egs-redis"].ports == null and
                .services["filebrowser"].ports == null and
                .services["filebrowser"].environment.FB_PASSWORD == "ci-new-host-filebrowser-password-0123456789" and
                .services["filebrowser"].environment.FB_ADMIN_PASSWORD == null and
                .services["egs-api"].ports[0].host_ip == "127.0.0.1" and
                .services["egs-api"].ports[0].published == "18000" and
                .services["egs-web"].ports[0].host_ip == "127.0.0.1" and
                .services["egs-web"].ports[0].published == "18080" and
                (.services["egs-api"].healthcheck.test[-1] | contains("/ready"))
            ' >/dev/null

  publish-frontend:
    name: Publish Signed Frontend via EGS Publisher
    runs-on: ubuntu-latest
    needs: [build, backend-validation, container-validation]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_frontend &&
      needs.build.result == 'success' &&
      needs.backend-validation.result == 'success' &&
      needs.container-validation.result == 'success'
    environment: production
    permissions:
      actions: read
      contents: read
    concurrency:
      group: egs-production-frontend-publish
      cancel-in-progress: false

    steps:
      - name: Checkout the approved release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download validated frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Preflight all non-secret gates
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EGS_PUBLISH_FRONTEND: ${{ inputs.publish_frontend }}
          EGS_GATE_BUILD: ${{ needs.build.result }}
          EGS_GATE_TYPECHECK: ${{ needs.build.result }}
          EGS_GATE_LINT: ${{ needs.build.result }}
          EGS_GATE_FRONTEND_TESTS: ${{ needs.build.result }}
          EGS_GATE_FRONTEND_ARTIFACT: ${{ needs.build.result }}
          EGS_GATE_BACKEND: ${{ needs.backend-validation.result }}
          EGS_GATE_CONTAINERS: ${{ needs.container-validation.result }}
          EGS_GATE5_STATUS: ${{ vars.EGS_GATE5_STATUS }}
          EGS_RELEASE_DIR: ${{ runner.temp }}/egs-frontend-release
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse --verify HEAD)"
          test "$EXPECTED_SHA" = "$actual_sha"
          test -z "$(git status --porcelain --untracked-files=all)"
          bash ops/deploy/controller.sh \
            --environment production \
            --ref "$EXPECTED_SHA" \
            --artifact-dir dist \
            --dry-run

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create and sign immutable frontend release
        env:
          EGS_RELEASE_SIGNING_KEY: ${{ secrets.EGS_RELEASE_SIGNING_KEY }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          set +x
          [[ -n "${EGS_RELEASE_SIGNING_KEY:-}" ]] || {
            echo "::error::EGS_RELEASE_SIGNING_KEY is not configured"
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          key_file="$RUNNER_TEMP/egs-release-signing-key.pem"
          release_dir="$RUNNER_TEMP/egs-frontend-release"
          cleanup() { rm -f -- "$key_file"; }
          trap cleanup EXIT
          mkdir -m 0700 "$release_dir"
          (umask 077; printf '%s' "$EGS_RELEASE_SIGNING_KEY" > "$key_file")
          chmod 0600 "$key_file"
          export EGS_RELEASE_SIGNING_KEY_FILE="$key_file"
          export EGS_RELEASE_OUTPUT="$release_dir"
          python scripts/package-frontend-release.py

      - name: Verify signed artifact before SSH access
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EGS_PUBLISH_FRONTEND: ${{ inputs.publish_frontend }}
          EGS_GATE_BUILD: ${{ needs.build.result }}
          EGS_GATE_TYPECHECK: ${{ needs.build.result }}
          EGS_GATE_LINT: ${{ needs.build.result }}
          EGS_GATE_FRONTEND_TESTS: ${{ needs.build.result }}
          EGS_GATE_FRONTEND_ARTIFACT: ${{ needs.build.result }}
          EGS_GATE_BACKEND: ${{ needs.backend-validation.result }}
          EGS_GATE_CONTAINERS: ${{ needs.container-validation.result }}
          EGS_GATE5_STATUS: ${{ vars.EGS_GATE5_STATUS }}
          EGS_RELEASE_DIR: ${{ runner.temp }}/egs-frontend-release
        run: |
          bash ops/deploy/controller.sh \
            --environment production \
            --ref "$EXPECTED_SHA" \
            --artifact-dir dist \
            --dry-run

      - name: Retain signed release evidence
        uses: actions/upload-artifact@v4
        with:
          name: egs-frontend-signed-${{ github.sha }}
          path: ${{ runner.temp }}/egs-frontend-release/*
          if-no-files-found: error
          retention-days: 30

      - name: Authorize publication after all gates
        id: package
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EGS_PUBLISH_FRONTEND: ${{ inputs.publish_frontend }}
          EGS_GATE_BUILD: ${{ needs.build.result }}
          EGS_GATE_TYPECHECK: ${{ needs.build.result }}
          EGS_GATE_LINT: ${{ needs.build.result }}
          EGS_GATE_FRONTEND_TESTS: ${{ needs.build.result }}
          EGS_GATE_FRONTEND_ARTIFACT: ${{ needs.build.result }}
          EGS_GATE_BACKEND: ${{ needs.backend-validation.result }}
          EGS_GATE_CONTAINERS: ${{ needs.container-validation.result }}
          EGS_GATE5_STATUS: ${{ vars.EGS_GATE5_STATUS }}
          EGS_RELEASE_DIR: ${{ runner.temp }}/egs-frontend-release
          EGS_PUBLISH_HOST: ${{ secrets.EGS_PUBLISH_HOST }}
          EGS_PUBLISH_PORT: ${{ secrets.EGS_PUBLISH_PORT }}
          EGS_PUBLISH_USER: ${{ secrets.EGS_PUBLISH_USER }}
          EGS_PUBLISH_SSH_PRIVATE_KEY: ${{ secrets.EGS_PUBLISH_SSH_PRIVATE_KEY }}
          EGS_PUBLISH_KNOWN_HOSTS: ${{ secrets.EGS_PUBLISH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          bash ops/deploy/controller.sh \
            --environment production \
            --ref "$EXPECTED_SHA" \
            --artifact-dir dist \
            --authorize-publish
          request_id="$(find "$EGS_RELEASE_DIR" -maxdepth 1 -type f -name '*.tar' -printf '%f\n' | sed 's/\.tar$//')"
          test "${#request_id}" -eq 32
          port="${EGS_PUBLISH_PORT:-2222}"
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Stage signed request and invoke the approved publisher
        env:
          EGS_PUBLISH_HOST: ${{ secrets.EGS_PUBLISH_HOST }}
          EGS_PUBLISH_PORT: ${{ steps.package.outputs.port }}
          EGS_PUBLISH_USER: ${{ secrets.EGS_PUBLISH_USER }}
          EGS_PUBLISH_SSH_PRIVATE_KEY: ${{ secrets.EGS_PUBLISH_SSH_PRIVATE_KEY }}
          EGS_PUBLISH_KNOWN_HOSTS: ${{ secrets.EGS_PUBLISH_KNOWN_HOSTS }}
          REQUEST_ID: ${{ steps.package.outputs.request_id }}
          EGS_RELEASE_DIR: ${{ runner.temp }}/egs-frontend-release
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/egs-publish-key"
          known_hosts_file="$RUNNER_TEMP/egs-publish-known-hosts"
          cleanup() { rm -f -- "$key_file" "$known_hosts_file"; }
          trap cleanup EXIT
          (umask 077; printf '%s\n' "$EGS_PUBLISH_SSH_PRIVATE_KEY" > "$key_file")
          (umask 077; printf '%s\n' "$EGS_PUBLISH_KNOWN_HOSTS" > "$known_hosts_file")
          chmod 0600 "$key_file" "$known_hosts_file"
          ssh-keygen -y -f "$key_file" >/dev/null
          ssh_args=(-p "$EGS_PUBLISH_PORT" -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts_file" -o ConnectTimeout=15)
          incoming=/var/lib/egs-publisher/incoming
          cleanup() {
            if ! ssh "${ssh_args[@]}" "$EGS_PUBLISH_USER@$EGS_PUBLISH_HOST" \
              "rm -f -- '$incoming/$REQUEST_ID.tar.part' '$incoming/$REQUEST_ID.json.part' '$incoming/$REQUEST_ID.sig.part'" >/dev/null 2>&1; then
              echo "::warning::Unable to clean incomplete staged request $REQUEST_ID"
            fi
            rm -f -- "$key_file" "$known_hosts_file"
          }
          trap cleanup EXIT
          for extension in tar json sig; do
            scp -P "$EGS_PUBLISH_PORT" -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts_file" \
              "$EGS_RELEASE_DIR/$REQUEST_ID.$extension" \
              "$EGS_PUBLISH_USER@$EGS_PUBLISH_HOST:$incoming/$REQUEST_ID.$extension.part"
          done
          ssh "${ssh_args[@]}" "$EGS_PUBLISH_USER@$EGS_PUBLISH_HOST" \
            "set -eu; for ext in tar json sig; do mv -- '$incoming/$REQUEST_ID.'\$ext'.part' '$incoming/$REQUEST_ID.'\$ext; done; sudo -n /usr/local/sbin/egs-publisher publish-pending"

      - name: Verify published production version
        env:
          RELEASE_DIR: ${{ runner.temp }}/egs-frontend-release
          REQUEST_ID: ${{ steps.package.outputs.request_id }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          attestation="$RELEASE_DIR/$REQUEST_ID.json"
          expected="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["git_commit"])' "$attestation")"
          test "$expected" = "$EXPECTED_SHA"
          version_file="$RUNNER_TEMP/egs-production-version.json"
          index_file="$RUNNER_TEMP/egs-production-index.html"
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-connrefused \
            --output "$version_file" https://gnambaservices.ci/VERSION.json
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-connrefused \
            --output "$index_file" https://gnambaservices.ci/
          actual="$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("git_commit", ""))' "$version_file")"
          if [[ "$actual" != "$EXPECTED_SHA" ]]; then
            echo "::error::Production serves commit $actual; expected $EXPECTED_SHA"
            exit 1
          fi
          asset_path="$(python - "$index_file" <<'PY'
          import re, pathlib, sys
          html = pathlib.Path(sys.argv[1]).read_text()
          match = re.search(r'''(?:src|href)=["'](/assets/[A-Za-z0-9._/-]+)["']''', html)
          if not match:
              raise SystemExit("no deployable /assets/ URL found in production index")
          print(match.group(1))
          PY
          )"
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-connrefused \
            "https://gnambaservices.ci$asset_path" >/dev/null
          python -c 'import json,sys; assert json.load(sys.stdin).get("status") == "ok"' \
            < <(curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-connrefused https://api.gnambaservices.ci/api/v1/health)
          summary="$(python -c 'import json,sys; value=json.load(open(sys.argv[1])); print(value.get("artifact_hash", ""))' "$attestation")"
          archive_hash="$(sha256sum "$RELEASE_DIR/$REQUEST_ID.tar" | cut -d ' ' -f 1)"
          {
            echo "## EGS controlled deployment"
            echo "- Result: production publication and frontend/API smoke checks passed"
            echo "- Git SHA: \`$EXPECTED_SHA\`"
            echo "- Release request: \`$REQUEST_ID\`"
            echo "- Frontend artifact hash: \`$summary\`"
            echo "- Signed archive SHA-256: \`$archive_hash\`"
            echo "- Workflow run: \`$GITHUB_RUN_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Production smoke PASS for signed commit $actual"

  # Production publication is deliberately limited to the signed frontend
  # publisher above. Backend/runtime rollout needs a reviewed infrastructure
  # target and is not inferred from a stale compose file or an SSH path.
