<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon par défaut, remplacé ensuite par SettingsContext si configuré -->
    <link rel="icon" href="/default-logo.svg" type="image/svg+xml" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GNAMBA SERVICES" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Cookie Policy pour éviter les erreurs __cf_bm en développement -->
    <meta name="cookie-policy" content="strict" />
    
    <!-- CSP gérée par nginx pour éviter les conflits de double CSP -->
    
    <title>GNAMBA SERVICES | Immobilier, Foncier & BTP en Côte d'Ivoire</title>

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="GNAMBA SERVICES, votre expert foncier, immobilier et BTP à Sikensi. Achat de terrain sécurisé, construction de villa, lotissement. Devis gratuit 48h."
    />
    <meta
      name="keywords"
      content="BTP, immobilier, foncier, construction, devis rapide, Sikensi, Côte d'Ivoire, GNAMBA SERVICES"
    />
    <meta name="author" content="GNAMBA SERVICES" />
    <meta name="theme-color" content="#1e40af" />
    <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
    content="GNAMBA SERVICES | Immobilier, Foncier & BTP en Côte d'Ivoire"
    />
    <meta
      property="og:description"
      content="GNAMBA SERVICES, votre expert foncier, immobilier et BTP à Sikensi. Achat de terrain sécurisé, construction de villa, lotissement. Devis gratuit 48h."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://gnambaservices.ci/" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="GNAMBA SERVICES | Immobilier, Foncier & BTP en Côte d'Ivoire"
    />
    <meta
      name="twitter:description"
      content="GNAMBA SERVICES, votre expert foncier, immobilier et BTP à Sikensi. Achat de terrain sécurisé, construction de villa, lotissement. Devis gratuit 48h."

    <meta name="twitter:image" content="/og-image.png" />

</html>
