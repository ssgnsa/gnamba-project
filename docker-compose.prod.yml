# ============================================
# EGS - Docker Compose PRODUCTION
# ============================================
# Configuration pour déploiement en production avec SSL
# Utiliser avec: docker-compose -f docker-compose.prod.yml up -d
# ============================================

services:
  # ============================================
  # NGINX Reverse Proxy avec SSL
  # ============================================
  nginx-proxy:
    image: nginx:alpine
    container_name: egs-nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - egs-frontend
      - wopi-gateway
      - collabora
    networks:
      - egs-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: egs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d/migrations
      - ./backups/postgres:/backups
    networks:
      - egs-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Kong API Gateway
  # ============================================
  kong:
    image: kong:2.8.1
    container_name: egs-kong
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8443:8443"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,rate-limiting
      KONG_LOG_LEVEL: info
    volumes:
      - ./kong:/var/lib/kong:ro
      - ./kong/logs:/var/log/kong
    networks:
      - egs-network
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Filebrowser - Gestion documentaire
  # ============================================
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: egs-filebrowser
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      - FB_BASE_URL=/
      - FB_ADDRESS=0.0.0.0
      - FB_PORT=80
      - FB_DATABASE=/database/filebrowser.db
    volumes:
      - /home/soma/partage/egs-docs:/srv
      - /home/soma/filebrowser/database:/database
      - /home/soma/filebrowser/config:/config
    networks:
      - egs-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # WOPI Gateway - Edition Office
  # ============================================
  wopi-gateway:
    build:
      context: ./wopi-gateway
      dockerfile: Dockerfile
    container_name: egs-wopi-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - WOPI_JWT_SECRET=${WOPI_JWT_SECRET}
      - WOPI_API_KEY=${WOPI_API_KEY}
      - WOPI_DOC_ROOT=/srv/egs-docs
      - WOPI_BASE_URL=https://wopi.gnambaservices.ci
      - COLLABORA_URL=https://office.gnambaservices.ci
    volumes:
      - /home/soma/partage/egs-docs:/srv/egs-docs
    networks:
      - egs-network
    depends_on:
      - filebrowser
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Collabora Online - WOPI rendering
  # ============================================
  collabora:
    image: collabora/code:latest
    container_name: egs-collabora
    restart: unless-stopped
    ports:
      - "9980:9980"
    environment:
      - domain=office.gnambaservices.ci
      - VUWS_MAX_WORKERS=2
      - extra_params=--o:ssl.enable=false
    cap_add:
      - MKNOD
    networks:
      - egs-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # n8n - Workflow automation
  # ============================================
  n8n:
    image: n8nio/n8n:latest
    container_name: egs-n8n
    restart: unless-stopped
    user: root
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-changeMe}
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_HOME=/home/node/.n8n
    volumes:
      - ./n8n:/home/node/.n8n
    networks:
      - egs-network
    depends_on:
      - postgres
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Samba - Partage réseau interne
  # ============================================
  samba:
    image: dperson/samba:latest
    container_name: egs-samba
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Africa/Abidjan}
    command:
      - "-u"
      - "${SAMBA_USERNAME:-egsuser};${SAMBA_PASSWORD:-S3cur3P@ss}"
      - "-s"
      - "egs-docs;/shared;yes;no;yes;all"
    volumes:
      - /home/soma/partage/egs-docs:/shared
    ports:
      - "139:139"
      - "445:445"
    networks:
      - egs-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # EGS Frontend Application
  # ============================================
  egs-frontend:
    image: egs-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    container_name: egs-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - kong
    networks:
      - egs-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Supabase Studio (Admin UI - Optionnel en prod)
  # ============================================
  # Décommenter uniquement si nécessaire (protéger par authentification)
  # studio:
  #   image: supabase/studio:20240101-8e4d1f0
  #   container_name: egs-studio
  #   restart: unless-stopped
  #   environment:
  #     STUDIO_PG_META_URL: http://meta:8080
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #     DEFAULT_ORGANIZATION_NAME: Gnamba Services
  #     DEFAULT_PROJECT_NAME: EGS
  #     SUPABASE_URL: http://kong:8000
  #     SUPABASE_PUBLIC_URL: ${VITE_SUPABASE_URL}
  #   expose:
  #     - "3000"
  #   depends_on:
  #     - postgres
  #   networks:
  #     - egs-network

volumes:
  postgres_data:
    driver: local
  postgres_backups:
    driver: local

networks:
  egs-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
