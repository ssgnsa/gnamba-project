# ============================================
# EGS - Nginx Production Configuration (Durci)
# ============================================
# Version: 2.0 (Phase 2: Sécurité & Hardening)
# Date: 2026-06-03
#
# AMÉLIORATIONS SÉCURITÉ:
# ✅ TLS 1.2 et 1.3 uniquement
# ✅ Ciphers forts (ECDHE priorité)
# ✅ server_tokens off
# ✅ HSTS, X-Frame-Options, X-Content-Type-Options
# ✅ Referrer-Policy strict
# ✅ CSP de base
# ✅ Rate limiting par zone
# ✅ Logs structurés
#
# Certificats requis:
#   - /etc/nginx/ssl/fullchain.pem (Let's Encrypt ou auto-signé)
#   - /etc/nginx/ssl/privkey.pem
#
# ============================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;

    # ============================================
    # Logging Configuration
    # ============================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'response_time=$request_time upstream_addr=$upstream_addr';

    log_format security '$remote_addr - [$time_local] "$request" '
                        'status=$status client="$http_user_agent" '
                        'ssl_protocol=$ssl_protocol ssl_cipher=$ssl_cipher '
                        'http_host=$http_host';

    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx/security.log security;

    # ============================================
    # Performance & Buffering
    # ============================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    types_hash_max_size 2048;
    client_max_body_size 100M;
    server_tokens off;

    # ============================================
    # Compression
    # ============================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        application/x-font-ttf
        application/font-woff
        font/opentype;

    # ============================================
    # Rate Limiting Zones
    # ============================================
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=admin:10m rate=2r/s;

    # ============================================
    # Upstream Backends
    # ============================================
    upstream egs_frontend {
        server egs-frontend:80 max_fails=3 fail_timeout=30s;
    }

    upstream egs_api {
        server kong:8000 max_fails=3 fail_timeout=30s;
    }

    upstream egs_filebrowser {
        server egs-filebrowser:80 max_fails=3 fail_timeout=30s;
    }

    upstream egs_n8n {
        server egs-n8n:5678 max_fails=3 fail_timeout=30s;
    }

    upstream egs_wopi {
        server egs-wopi-gateway:3000 max_fails=3 fail_timeout=30s;
    }

    upstream egs_collabora {
        server egs-collabora:9980 max_fails=3 fail_timeout=30s;
    }

    # ============================================
    # HTTPS Redirect (Port 80)
    # ============================================
    server {
        listen 80;
        listen [::]:80;
        server_name gnambaservices.ci www.gnambaservices.ci portal.gnambaservices.ci erp.gnambaservices.ci www.erp.gnambaservices.ci immobilier.gnambaservices.ci foncier.gnambaservices.ci;

        # ACME challenge for certbot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health check endpoint (HTTP)
        location /health {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        location / {
            proxy_pass http://egs-frontend:80;
            proxy_http_version 1.1;
            proxy_hide_header Cache-Control;
            proxy_hide_header Pragma;
            proxy_hide_header Expires;
            add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400" always;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 90;
        }

        location = /assets/index.js {
            proxy_pass http://egs-frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
        }

        location = /assets/index.css {
            proxy_pass http://egs-frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
        }

        location ~* ^/assets/index-[A-Za-z0-9_-]+\.js$ {
            rewrite ^/assets/index-[A-Za-z0-9_-]+\.js$ /assets/index.js last;
        }

        location ~* ^/assets/index-[A-Za-z0-9_-]+\.css$ {
            rewrite ^/assets/index-[A-Za-z0-9_-]+\.css$ /assets/index.css last;
        }
    }

    # ============================================
    # Document Management Server (HTTP entrypoint for tunnel)
    # Domaine: docs.gnambaservices.ci
    # Proxies vers FileBrowser
    # ============================================
    server {
        listen 80;
        listen [::]:80;
        server_name docs.gnambaservices.ci fichiers.gnambaservices.ci files.gnambaservices.ci;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /health {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        location / {
            limit_req zone=general burst=30 nodelay;
            proxy_pass http://egs_filebrowser/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
        }
    }

    # ============================================
    # TLS Configuration (Global)
    # ============================================
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ============================================
    # HSTS Header (Global)
    # ============================================
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ============================================
    # Security Headers (Global)
    # ============================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

    # ============================================
    # Main Application Server (HTTPS)
    # Domaine: erp.gnambaservices.ci
    # ============================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name erp.gnambaservices.ci www.erp.gnambaservices.ci;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # CSP pour ERP (frontend + API calls)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://static.cloudflareinsights.com https://cloudflareinsights.com https://cdn.onesignal.com https://challenges.cloudflare.com; script-src-elem 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://cloudflareinsights.com https://cdn.onesignal.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com https://r2cdn.perplexity.ai; connect-src 'self' https://thykrnoqgylrbfupophs.supabase.co wss://thykrnoqgylrbfupophs.supabase.co https://api.gnambaservices.ci https://cloudflareinsights.com https://static.cloudflareinsights.com https://o0.ingest.sentry.io https://onesignal.com https://api.onesignal.com https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;

        # Autres headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600" always;

        location / {
            limit_req zone=general burst=50 nodelay;
            proxy_pass http://egs_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 90s;
            proxy_connect_timeout 75s;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }

    # ============================================
    # API Gateway Server (HTTPS)
    # Domaine: api.gnambaservices.ci
    # Proxies vers Kong (rate-limited)
    # ============================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.gnambaservices.ci;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self';" always;
        add_header X-Frame-Options "DENY" always;

        # Strict rate limiting for API
        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://egs_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 120s;
            proxy_connect_timeout 75s;
        }

        # API health endpoint
        location /health {
            access_log off;
            proxy_pass http://egs_api/health;
        }
    }

    # ============================================
    # Document Management Server (HTTPS)
    # Domaine: docs.gnambaservices.ci
    # Proxies vers FileBrowser
    # ============================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name docs.gnambaservices.ci fichiers.gnambaservices.ci;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        location / {
            limit_req zone=general burst=30 nodelay;
            proxy_pass http://egs_filebrowser/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
        }
    }

    # ============================================
    # Workflow Automation Server (HTTPS)
    # Domaine: n8n.gnambaservices.ci
    # Proxies vers n8n (admin-limited)
    # ============================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name n8n.gnambaservices.ci workflows.gnambaservices.ci;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self';" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        location / {
            limit_req zone=admin burst=10 nodelay;
            proxy_pass http://egs_n8n;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }
    }

    # ============================================
    # WOPI Gateway Server (HTTPS)
    # Domaine: wopi.gnambaservices.ci
    # Proxies vers WOPI Gateway (JWT-protected)
    # ============================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name wopi.gnambaservices.ci;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://egs_wopi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
        }
    }

    # ============================================
    # Collabora Online Server (HTTPS)
    # Domaine: office.gnambaservices.ci
    # Proxies vers Collabora (WebSocket + long polling)
    # ============================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name office.gnambaservices.ci;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'self';" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        location / {
            limit_req zone=general burst=100 nodelay;
            proxy_pass http://egs_collabora;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            client_max_body_size 0;
        }

        # WebSocket support for Collabora
        location /lool {
            proxy_pass http://egs_collabora;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    # ============================================
    # Status & Monitoring (Local only)
    # ============================================
    server {
        listen 8080;
        listen [::]:8080;
        server_name localhost 127.0.0.1;

        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }
    }
}
