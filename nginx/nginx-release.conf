server {
    listen 80;
    listen [::]:80;
    server_name gnambaservices.ci www.gnambaservices.ci portal.gnambaservices.ci erp.gnambaservices.ci www.erp.gnambaservices.ci immobilier.gnambaservices.ci foncier.gnambaservices.ci;

    root /var/www/egs/current;
    index index.html;
    server_tokens off;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    location = /VERSION.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /VERSION.json =404;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location = /assets/index.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location = /assets/index.css {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400" always;
        try_files $uri $uri/ /index.html;
    }
}
